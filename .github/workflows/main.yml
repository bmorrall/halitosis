name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} Rails ${{ matrix.rails || 'none' }}
    strategy:
      matrix:
        ruby:
          - "3.3.11"
          - "3.4.9"
          - "4.0.4"
        rails:
          - ""
          - "7.2"
          - "8.0"
          - "8.1"

    env:
      RAILS_VERSION: ${{ matrix.rails }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
